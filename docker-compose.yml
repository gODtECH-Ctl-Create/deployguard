services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: deployguard
      POSTGRES_USER: deployguard
      POSTGRES_PASSWORD: deployguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deployguard -d deployguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://deployguard:deployguard@postgres:5432/deployguard
      DEPLOYGUARD_API_KEY: local-dev-api-key
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_URL: http://api:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
