apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployguard-api
  namespace: deployguard
  labels:
    app.kubernetes.io/name: deployguard
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: deployguard
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: deployguard
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: deployguard-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: deployguard-config
                  key: API_PORT
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: deployguard-secrets
                  key: DATABASE_URL
            - name: DEPLOYGUARD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: deployguard-secrets
                  key: DEPLOYGUARD_API_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: deployguard-api
  namespace: deployguard
  labels:
    app.kubernetes.io/name: deployguard
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: deployguard
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 4000
      targetPort: http
